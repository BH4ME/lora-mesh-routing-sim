[platformio]
default_envs = native

[env]
lib_deps =
    jgromes/RadioLib@7.6.0

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -DMESHECHO_CPR_NATIVE=1
build_src_filter = +<*>

[env:esp32dev_sx1262]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DMESHECHO_CPR_RADIO_SX1262=1
    -DMESHECHO_CPR_NODE_ID=1
    -DMESHECHO_CPR_LORA_NSS=5
    -DMESHECHO_CPR_LORA_DIO1=26
    -DMESHECHO_CPR_LORA_RST=14
    -DMESHECHO_CPR_LORA_BUSY=27
    -DMESHECHO_CPR_LORA_FREQ_MHZ=915.0
    -DMESHECHO_CPR_LORA_BW_KHZ=125.0
    -DMESHECHO_CPR_LORA_SF=9
    -DMESHECHO_CPR_LORA_CR=7
    -DMESHECHO_CPR_LORA_POWER_DBM=17
    -DMESHECHO_CPR_LORA_TCXO_VOLTAGE=1.6
    -DMESHECHO_CPR_LORA_USE_LDO=0
    -DMESHECHO_CPR_LORA_DIO2_RF_SWITCH=1
build_src_filter = +<*>

[env:esp32dev_sx127x]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DMESHECHO_CPR_RADIO_SX127X=1
    -DMESHECHO_CPR_NODE_ID=1
    -DMESHECHO_CPR_LORA_NSS=5
    -DMESHECHO_CPR_LORA_DIO0=26
    -DMESHECHO_CPR_LORA_SX127X_DIO1=27
    -DMESHECHO_CPR_LORA_RST=14
    -DMESHECHO_CPR_LORA_FREQ_MHZ=915.0
    -DMESHECHO_CPR_LORA_BW_KHZ=125.0
    -DMESHECHO_CPR_LORA_SF=9
    -DMESHECHO_CPR_LORA_CR=7
    -DMESHECHO_CPR_LORA_POWER_DBM=17
    -DMESHECHO_CPR_LORA_GAIN=0
build_src_filter = +<*>

[env:nrf52840_sx1262]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DMESHECHO_CPR_RADIO_SX1262=1
    -DMESHECHO_CPR_NODE_ID=1
    ; Illustrative Feather + external SX1262 profile; verify wiring first.
    -DMESHECHO_CPR_LORA_NSS=10
    -DMESHECHO_CPR_LORA_DIO1=6
    -DMESHECHO_CPR_LORA_RST=5
    -DMESHECHO_CPR_LORA_BUSY=9
    -DMESHECHO_CPR_LORA_FREQ_MHZ=915.0
    -DMESHECHO_CPR_LORA_BW_KHZ=125.0
    -DMESHECHO_CPR_LORA_SF=9
    -DMESHECHO_CPR_LORA_CR=7
    -DMESHECHO_CPR_LORA_POWER_DBM=17
    -DMESHECHO_CPR_LORA_TCXO_VOLTAGE=1.6
    -DMESHECHO_CPR_LORA_USE_LDO=0
    -DMESHECHO_CPR_LORA_DIO2_RF_SWITCH=1
    -include${PROJECT_DIR}/include/meshecho_cpr_nrf_tone_compat.hpp
build_src_filter = +<*>
