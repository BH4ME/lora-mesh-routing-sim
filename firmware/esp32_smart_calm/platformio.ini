[platformio]
default_envs = esp32dev_sx1262

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D SMART_CALM_NODE_ID=1
    -D SMART_CALM_LORA_NSS=18
    -D SMART_CALM_LORA_DIO1=26
    -D SMART_CALM_LORA_RST=14
    -D SMART_CALM_LORA_BUSY=27
    -D SMART_CALM_LORA_FREQ_MHZ=915.0
    -D SMART_CALM_LORA_TCXO_VOLTAGE=1.6
    -D SMART_CALM_LORA_USE_LDO=0

[env:esp32dev_sx1262]
build_flags =
    ${env.build_flags}
    -D SMART_CALM_RADIO_SX127X=0

[env:esp32dev_sx127x]
build_flags =
    ${env.build_flags}
    -D SMART_CALM_RADIO_SX127X=1
    -D SMART_CALM_LORA_GAIN=0

; SX1262 pin mapping: NSS, DIO1, RST, BUSY.
; SX127x/RFM9x pin mapping: NSS, DIO0, RST, DIO1.
; The same macro names are reused so the code stays one-file:
; SMART_CALM_LORA_DIO1 is the interrupt pin and SMART_CALM_LORA_BUSY is DIO1
; when SMART_CALM_RADIO_SX127X=1.
